schema_version: "1.1"
name: spike-implement-drift
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Implement the spike ABC-36.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 20
  timeout_seconds: 120
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: spike-implement
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-36'
  - name: drift-comment
    type: regex
    target: mock_calls
    pattern: 'addCommentToJiraIssue[\s\S]*### Drift[\s\S]*(json|999\.00)'
  - name: no-mark
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue|createConfluencePage'
    match: not_contains
  - name: no-worktree
    type: tool_used
    tool: Bash
    input_match: 'branch\.py --worktree'
    min: 0
    max: 0
  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
