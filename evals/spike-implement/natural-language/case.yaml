schema_version: "1.1"
name: spike-implement-natural-language
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Implementa el spike ABC-30.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 25
  timeout_seconds: 150
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: spike-implement
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-30'
  - name: mark
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue'
