schema_version: "1.1"
name: spike-implement-personal-data
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Implement the spike ABC-30.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 180
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: spike-implement
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-30'
  - name: asks-for-the-contact-and-keeps-it-out-of-the-files
    type: llm
    criteria: The final message asks the person for the contact (an email or a name) that the experiment needs for the User-Agent, and also says that the contact reaches the experiment only at run time, for example through an environment variable, so that it is not written in a file, a commit or a saved command. Both parts must be present.
  - name: writes-no-email-in-a-command
    type: tool_used
    tool: Bash
    input_match: '[\w.+-]+@[\w-]+\.[\w.-]+'
    min: 0
    max: 0
