schema_version: "1.1"
name: epic-close-happy
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: '/gemba-code:epic-close ABC-60'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 120
graders:
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-60'
  - name: mark-by-destination
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue[\s\S]*id\W+31'
  - name: does-not-wait-for-the-related-item
    type: regex
    target: mock_calls
    pattern: 'issueIdOrKey\W+(ABC-70|70\b)|searchJiraIssuesUsingJql|getJiraIssueRemoteIssueLinks|\bfetch\b|\bsearch\b'
    match: not_contains
  - name: one-transition
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue[\s\S]*transitionJiraIssue'
    match: not_contains
  - name: reports-the-close
    type: regex
    pattern: 'browse/ABC-60[\s\S]*\bdone\b|\bdone\b[\s\S]*browse/ABC-60'
    flags: i
  - name: no-git
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-worklog
    type: regex
    target: mock_calls
    pattern: 'addOrEditJiraIssueWorklog'
    match: not_contains
