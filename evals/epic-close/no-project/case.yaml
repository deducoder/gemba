schema_version: "1.1"
name: epic-close-no-project
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: '/gemba-code:epic-close ABC-60'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 8
  timeout_seconds: 120
graders:
  - name: no-jira
    type: regex
    target: mock_calls
    pattern: 'Jira|Atlassian|Confluence|\bfetch\b|\bsearch\b'
    flags: i
    match: not_contains
  - name: setup
    type: regex
    pattern: '/gemba:setup'
  - name: no-git
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-worklog
    type: regex
    target: mock_calls
    pattern: 'addWorklogToJiraIssue'
    match: not_contains
