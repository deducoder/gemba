schema_version: "1.1"
name: epic-close-not-an-epic
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: '/gemba-code:epic-close ABC-60'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 8
  timeout_seconds: 120
graders:
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-60'
  - name: no-write
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue|createJiraIssue|editJiraIssue|createIssueLink|addOrEditJiraIssueComment'
    match: not_contains
  - name: reason
    type: regex
    pattern: 'story'
    flags: i
  - name: no-git
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-worklog
    type: regex
    target: mock_calls
    pattern: 'addWorklogToJiraIssue'
    match: not_contains
