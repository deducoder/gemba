schema_version: "1.1"
name: spike-close-done-nothing-left
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Close the spike ABC-39.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 120
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: spike-close
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-39'
  - name: previewed
    type: tool_used
    tool: Bash
    input_match: 'branch\.py --discard --dry-run spike ABC-39'
  - name: not-marked
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue'
    match: not_contains
  - name: nothing-deleted
    type: tool_used
    tool: Bash
    input_match: 'branch\.py --discard spike'
    min: 0
    max: 0
  - name: says-so
    type: regex
    pattern: 'nothing (is |was )?(left|to (close|delete|do))'
    flags: i
