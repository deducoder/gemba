schema_version: "1.1"
name: spike-close-wrong-status
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Close the spike ABC-32.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 10
  timeout_seconds: 120
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: spike-close
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-32'
  - name: no-write
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue|addCommentToJiraIssue|addWorklogToJiraIssue|createJiraIssue|editJiraIssue'
    match: not_contains
  - name: nothing-deleted
    type: tool_used
    tool: Bash
    input_match: 'branch\.py --discard'
    min: 0
    max: 0
  - name: reason
    type: regex
    pattern: '\bbacklog\b'
    flags: i
