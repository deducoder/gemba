schema_version: "1.1"
name: spike-close-no-project
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Close the spike ABC-39.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 8
  timeout_seconds: 120
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: spike-close
  - name: no-jira
    type: regex
    target: mock_calls
    pattern: 'Jira|Confluence'
    match: not_contains
  - name: setup
    type: regex
    pattern: '/gemba:setup'
