schema_version: "1.1"
name: spike-close-happy
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: '/gemba-code:spike-close ABC-39'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 16
  timeout_seconds: 120
graders:
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-39'
  - name: discards-shown-before-the-mark
    type: tool_order
    before:
      tool: Bash
      input_match: 'branch\.py --discard --dry-run spike ABC-39'
    after: mcp__plugin_atlassian-stub_atlassian__transitionJiraIssue
  - name: mark-by-destination
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue[\s\S]*id\W+47'
  - name: deleted-after-the-mark
    type: tool_order
    before: mcp__plugin_atlassian-stub_atlassian__transitionJiraIssue
    after:
      tool: Bash
      input_match: 'branch\.py --discard spike ABC-39'
  - name: no-comment-no-worklog
    type: regex
    target: mock_calls
    pattern: 'addCommentToJiraIssue|addWorklogToJiraIssue'
    match: not_contains
  - name: no-merge
    type: tool_used
    tool: Bash
    input_match: 'branch\.py --merge'
    min: 0
    max: 0
  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
