schema_version: "1.1"
name: spike-close-transition-error
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: '/gemba-code:spike-close ABC-39'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 16
  timeout_seconds: 120
graders:
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-39'
  - name: previewed
    type: tool_used
    tool: Bash
    input_match: 'branch\.py --discard --dry-run spike ABC-39'
  - name: tried
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue'
  - name: nothing-deleted
    type: tool_used
    tool: Bash
    input_match: 'branch\.py --discard spike'
    min: 0
    max: 0
  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
  - name: reason
    type: regex
    pattern: 'not valid|refus|reject|error'
    flags: i
