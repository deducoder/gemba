schema_version: "1.1"
name: research-existing-page
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Research this question and publish the answer: Can SQLite enforce a unique value only on some rows of a table? Use only these two facts and do not search the web: the official page https://www.sqlite.org/partialindex.html says that a partial index is an index over a subset of the rows of a table, chosen by a WHERE clause, and that a UNIQUE partial index enforces uniqueness only among the rows that satisfy the WHERE clause; the blog article https://example.com/blog/partial-indexes repeats the example.'
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  max_turns: 25
  timeout_seconds: 180
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: research
  - name: updates-the-page-of-the-question
    type: regex
    target: mock_calls
    pattern: 'updateConfluenceContent[\s\S]*1007'
  - name: creates-no-second-page
    type: regex
    target: mock_calls
    pattern: 'createConfluenceContent'
    match: not_contains
  - name: descendants-down-to-the-pages
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__getConfluencePageDescendants
    input_match: '"depth":\s*([3-9]|[1-9]\d)'
