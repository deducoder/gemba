schema_version: "1.1"
name: epic-implement-rejected-transition
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Start the epic ABC-50.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 150
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: epic-implement
  - name: tried-the-mark
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue[\s\S]*id\W+41'
  - name: reason
    type: regex
    pattern: 'not valid|no es válid|rechaz|reject|refus'
    flags: i
  - name: no-children-listed
    type: regex
    pattern: 'ABC-5[1-6]'
    match: not_contains
  - name: no-worklog-or-estimate
    type: regex
    target: mock_calls
    pattern: 'addWorklogToJiraIssue|editJiraIssue'
    match: not_contains
