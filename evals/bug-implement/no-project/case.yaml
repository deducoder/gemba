schema_version: "1.1"
name: bug-implement-no-project
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Fix the bug ABC-30.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 20
  timeout_seconds: 400
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: bug-implement
  - name: no-jira
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue|transitionJiraIssue'
    match: not_contains
  - name: setup
    type: regex
    pattern: '/gemba:setup'
