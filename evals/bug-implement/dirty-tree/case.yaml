schema_version: "1.1"
name: bug-implement-dirty-tree
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Fix the bug ABC-30.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 23
  timeout_seconds: 120
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: bug-implement
  - name: checked
    type: tool_used
    tool: Bash
    input_match: 'branch\.py --check bug ABC-30'
  - name: no-write
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue|addOrEditJiraIssueComment|addWorklogToJiraIssue|createJiraIssue|editJiraIssue'
    match: not_contains
  - name: no-branch
    type: tool_used
    tool: Bash
    input_match: 'branch\.py bug'
    min: 0
    max: 0
  - name: why
    type: regex
    pattern: 'uncommitted|tracking'
    flags: i
