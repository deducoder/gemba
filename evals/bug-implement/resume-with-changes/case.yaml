schema_version: "1.1"
name: bug-implement-resume-with-changes
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Fix the bug ABC-30.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 29
  timeout_seconds: 180
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: bug-implement
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-30'
  - name: no-mark
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue|addOrEditJiraIssueWorklog'
    match: not_contains
  - name: checked
    type: tool_used
    tool: Bash
    input_match: 'branch\.py --check bug ABC-30'
  - name: switched
    type: tool_used
    tool: Bash
    input_match: 'branch\.py bug ABC-30'
  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
