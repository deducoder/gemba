schema_version: "1.1"
name: bug-implement-not-a-bug
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Fix the bug ABC-31.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 300
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: bug-implement
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-31'
  - name: no-write
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue|addCommentToJiraIssue|addWorklogToJiraIssue|createJiraIssue|editJiraIssue'
    match: not_contains
  - name: no-develop-or-branch
    type: tool_used
    tool: Bash
    input_match: 'develop\.py|branch\.py'
    min: 0
    max: 0
  - name: type
    type: regex
    pattern: '\bstory\b'
    flags: i
