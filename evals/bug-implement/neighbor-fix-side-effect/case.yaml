schema_version: "1.1"
name: bug-implement-neighbor-fix-side-effect
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Fix the bug ABC-30. I approve in advance the plan you propose: build it without waiting.'
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
  max_turns: 54
  timeout_seconds: 240
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: bug-implement
  - name: no-drift
    type: regex
    target: mock_calls
    pattern: 'addOrEditJiraIssueComment'
    match: not_contains
  - name: fix-redone-before-the-commit
    type: tool_order
    before:
      tool: Edit
      input_match: 'invoices\.py[\s\S]*return 2'
    after:
      tool: Bash
      input_match: 'git commit.*fix\('
  - name: usage-neighbor-before-the-fix-commit
    type: tool_order
    before:
      tool: Bash
      input_match: '^(?![\s\S]*develop\.py)[\s\S]*python3 invoices\.py\s*(;|&|\||2?>|$)'
    after:
      tool: Bash
      input_match: 'git commit.*fix\('
