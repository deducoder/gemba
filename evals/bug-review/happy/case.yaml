schema_version: "1.1"
name: bug-review-happy
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Review the bug ABC-30.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 48
  timeout_seconds: 360
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: bug-review
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-30'
  - name: mark-by-destination
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue[\s\S]*id\W+41'
  - name: only-reads-before-the-mark
    type: regex
    target: mock_calls
    pattern: '(createJiraIssue|editJiraIssue|addCommentToJiraIssue|addWorklogToJiraIssue)[\s\S]*transitionJiraIssue'
    match: not_contains
  - name: test-without-the-fix-after-the-mark
    type: tool_order
    before: mcp__plugin_atlassian-stub_atlassian__transitionJiraIssue
    after:
      tool: Bash
      input_match: 'scripts/develop\.py run .*checkout.*test_invoices'
  - name: worktree-closed
    type: tool_order
    before:
      tool: Bash
      input_match: 'scripts/develop\.py run .*checkout.*test_invoices'
    after:
      tool: Bash
      input_match: 'scripts/develop\.py close'
  - name: fix-touches-the-cause
    type: tool_used
    tool: Bash
    input_match: 'git diff --name-only origin/develop\.\.\.HEAD'
  - name: simplify-after-the-mark
    type: tool_order
    before: mcp__plugin_atlassian-stub_atlassian__transitionJiraIssue
    after:
      tool: Skill
      input_match: 'simplify.*origin/develop\.\.\.HEAD'
  - name: code-review-after-simplify
    type: tool_order
    before:
      tool: Skill
      input_match: 'simplify.*origin/develop\.\.\.HEAD'
    after:
      tool: Skill
      input_match: 'code-review.*origin/develop\.\.\.HEAD'
  - name: neighbors-after-the-review
    type: tool_order
    before:
      tool: Skill
      input_match: 'code-review.*origin/develop\.\.\.HEAD'
    after:
      tool: Bash
      input_match: 'invoices\.py nadie'
  - name: neighbors-before-the-push
    type: tool_order
    before:
      tool: Bash
      input_match: 'invoices\.py nadie'
    after:
      tool: Bash
      input_match: 'git push'
  - name: push-with-upstream
    type: tool_used
    tool: Bash
    input_match: 'git push -u origin bug/ABC-30/invoice-totals-omit-the-tax'
  - name: no-worklog-yet
    type: regex
    target: mock_calls
    pattern: addWorklogToJiraIssue
    match: not_contains
