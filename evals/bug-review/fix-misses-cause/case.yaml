schema_version: "1.1"
name: bug-review-fix-misses-cause
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Review the bug ABC-30.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 28
  timeout_seconds: 180
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: bug-review
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-30'
  - name: diff-checked
    type: tool_used
    tool: Bash
    input_match: 'git diff --name-only origin/develop\.\.\.HEAD'
  - name: drift-comment
    type: regex
    target: mock_calls
    pattern: 'addCommentToJiraIssue[\s\S]*### Drift[\s\S]*Criterion[\s\S]*(?<!test_)invoices\.py:15'
  - name: no-simplify
    type: tool_used
    tool: Skill
    input_match: simplify
    min: 0
    max: 0
  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
  - name: no-worklog
    type: regex
    target: mock_calls
    pattern: 'addWorklogToJiraIssue'
    match: not_contains
