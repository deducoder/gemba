schema_version: "1.1"
name: bug-review-wrong-branch
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Review the bug ABC-30.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 11
  timeout_seconds: 60
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: bug-review
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-30'
  - name: checked
    type: tool_used
    tool: Bash
    input_match: 'branch\.py --ready bug ABC-30'
  - name: no-write
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue|addCommentToJiraIssue|addWorklogToJiraIssue|createJiraIssue|editJiraIssue'
    match: not_contains
  - name: no-develop
    type: tool_used
    tool: Bash
    input_match: 'develop\.py'
    min: 0
    max: 0
  - name: no-simplify
    type: tool_used
    tool: Skill
    input_match: simplify
    min: 0
    max: 0
  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
  - name: reason
    type: regex
    pattern: 'bug/ABC-30/invoice-totals-omit-the-tax'
    flags: i
