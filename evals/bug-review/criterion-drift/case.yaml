schema_version: "1.1"
name: bug-review-criterion-drift
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Review the bug ABC-30.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 48
  timeout_seconds: 360
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: bug-review
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-30'
  - name: ran-the-criterion
    type: tool_used
    tool: Bash
    input_match: 'invoices\.py initech'
  - name: drift-comment
    type: regex
    target: mock_calls
    pattern: 'addCommentToJiraIssue[\s\S]*### Drift[\s\S]*Criterion[\s\S]*initech'
  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
  - name: no-worklog
    type: regex
    target: mock_calls
    pattern: 'addWorklogToJiraIssue'
    match: not_contains
