schema_version: "1.1"
name: story-review-wrong-branch
plugins:
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Review the story ABC-53.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 300
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: story-review
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-53'
  - name: checked
    type: tool_used
    tool: Bash
    input_match: 'branch\.py --ready story ABC-53'
  - name: no-write
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue|addCommentToJiraIssue|addWorklogToJiraIssue|createJiraIssue|editJiraIssue'
    match: not_contains
  - name: no-simplify
    type: tool_used
    tool: Skill
    input_match: simplify
    min: 0
    max: 0
  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
  - name: reason
    type: regex
    pattern: 'story/ABC-53/print-the-invoices-as-csv'
    flags: i
