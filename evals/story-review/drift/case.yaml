schema_version: "1.1"
name: story-review-drift
plugins:
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Review the story ABC-57.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 40
  timeout_seconds: 900
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: story-review
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-57'
  - name: drift-comment
    type: regex
    target: mock_calls
    pattern: 'addCommentToJiraIssue[\s\S]*### Drift[\s\S]*Criterion[\s\S]*999\.00'
  - name: re-ran-the-evidence
    type: tool_used
    tool: Bash
    input_match: 'invoices\.py acme'
  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
  - name: no-worklog
    type: regex
    target: mock_calls
    pattern: 'addWorklogToJiraIssue'
    match: not_contains
