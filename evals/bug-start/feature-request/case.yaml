schema_version: "1.1"
name: bug-start-feature-request
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Make invoices.py accept --csv to print the customer''s invoices as CSV.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 26
  timeout_seconds: 180
graders:
  - name: no-bug-start
    type: tool_used
    tool: Skill
    input_match: bug-start
    min: 0
    max: 0
