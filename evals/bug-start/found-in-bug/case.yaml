schema_version: "1.1"
name: bug-start-found-in-bug
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a bug found while fixing ABC-12: the totals that invoices.py prints leave out the tax.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 24
  timeout_seconds: 180
graders:
  - name: created
    type: regex
    target: mock_calls
    pattern: 'issueTypeName\W+Bug'
  - name: linked-to-the-bug
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__executeWrite
    input_match: '^(?=[\s\S]*createJiraIssueLink)(?=[\s\S]*ABC-50[\s\S]*ABC-12|ABC-12[\s\S]*ABC-50)'
