schema_version: "1.1"
name: bug-start-no-cause
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a bug: the totals that invoices.py prints leave out the tax.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 17
  timeout_seconds: 120
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: bug-start
  - name: no-create
    type: regex
    target: mock_calls
    pattern: createJiraIssue
    match: not_contains
  - name: develop-closed
    type: tool_order
    before:
      tool: Bash
      input_match: 'scripts/develop\.py open'
    after:
      tool: Bash
      input_match: 'scripts/develop\.py close'
  - name: shows-what-it-ran
    type: regex
    pattern: 'invoice-rates|rates service|servicio'
