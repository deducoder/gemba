schema_version: "1.1"
name: bug-start-no-project
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a bug: the totals that invoices.py prints leave out the tax.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 600
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: bug-start
  - name: no-jira
    type: regex
    target: mock_calls
    pattern: 'JiraIssue|IssueLink'
    match: not_contains
  - name: setup
    type: regex
    pattern: '/gemba:setup'
