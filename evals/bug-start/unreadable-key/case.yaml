schema_version: "1.1"
name: bug-start-unreadable-key
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a bug found while building ABC-99: the totals that invoices.py prints leave out the tax.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 8
  timeout_seconds: 60
graders:
  - name: no-create
    type: regex
    target: mock_calls
    pattern: createJiraIssue
    match: not_contains
  - name: names-the-key
    type: regex
    pattern: 'ABC-99'
