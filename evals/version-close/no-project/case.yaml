schema_version: "1.1"
name: version-close-no-project
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: '/gemba-code:version-close'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 6
  timeout_seconds: 60
graders:
  - name: no-atlassian
    type: regex
    target: mock_calls
    pattern: 'Confluence|Jira'
    match: not_contains
  - name: asks-for-setup
    type: regex
    pattern: '/gemba:setup'
