schema_version: "1.1"
name: story-implement-rejected-transition
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Implement ABC-30.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 120
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: story-implement
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-30'
  - name: tried
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue'
  - name: no-branch
    type: tool_used
    tool: Bash
    input_match: 'branch\.py story'
    min: 0
    max: 0
  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
  - name: reason
    type: regex
    pattern: 'not valid|refus|reject'
    flags: i
