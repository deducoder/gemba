schema_version: "1.1"
name: story-implement-resume-with-changes
plugins:
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Implement ABC-41.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 15
  timeout_seconds: 300
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: story-implement
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-41'
  - name: no-mark
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue|addWorklogToJiraIssue'
    match: not_contains
  - name: checked
    type: tool_used
    tool: Bash
    input_match: 'branch\.py --check story ABC-41'
  - name: switched
    type: tool_used
    tool: Bash
    input_match: 'branch\.py story ABC-41'
  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
