schema_version: "1.1"
name: project-create-material-first
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: '/gemba-code:project-create a dog walking app. The demand is Market: I build it to sell it. My first notes are in notes.md.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 120
graders:
  - name: looked-for-an-existing-vision
    type: regex
    target: mock_calls
    pattern: 'getConfluencePageDescendants'
  - name: lists-the-whatsapp-point
    type: regex
    pattern: 'WhatsApp'
  - name: lists-the-card-point
    type: regex
    pattern: '[Cc]ard'
  - name: lists-the-insurance-point
    type: regex
    pattern: '[Ii]nsurance'
  - name: no-page-yet
    type: regex
    target: mock_calls
    pattern: 'createConfluencePage|updateConfluencePage'
    match: not_contains
