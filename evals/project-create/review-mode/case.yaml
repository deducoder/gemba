schema_version: "1.1"
name: project-create-review-mode
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: '/gemba-code:project-create'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 150
graders:
  - name: reads-the-published-vision
    type: regex
    target: mock_calls
    pattern: 'getConfluencePage[^D]'
  - name: no-origin-question
    type: regex
    pattern: '[Oo]riginates the demand'
    match: not_contains
  - name: asks-what-moved
    type: regex
    pattern: '[Mm]oved|[Cc]hanged'
  - name: writes-nothing-yet
    type: regex
    target: mock_calls
    pattern: 'createConfluencePage|updateConfluencePage'
    match: not_contains
