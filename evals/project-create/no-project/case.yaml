schema_version: "1.1"
name: project-create-no-project
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: '/gemba-code:project-create a dog walking app'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 6
  timeout_seconds: 60
graders:
  - name: no-confluence
    type: regex
    target: mock_calls
    pattern: 'Confluence'
    match: not_contains
  - name: setup
    type: regex
    pattern: '/gemba:setup'
