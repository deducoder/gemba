schema_version: "1.1"
name: story-close-unreviewed-commits
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: '/gemba-code:story-close ABC-73'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 11
  timeout_seconds: 60
graders:
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-73'
  - name: merge-tried
    type: tool_used
    tool: Bash
    input_match: 'branch\.py --merge story ABC-73'
  - name: no-write
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue|addCommentToJiraIssue|addWorklogToJiraIssue|createJiraIssue|editJiraIssue'
    match: not_contains
  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
  - name: reason
    type: regex
    pattern: 'commit'
    flags: i
