schema_version: "1.1"
name: spike-review-natural-language
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Revisa el spike ABC-30 y verifica que sus hallazgos se sostienen.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 200
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: spike-review
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-30'
  - name: mark
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue'
