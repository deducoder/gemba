schema_version: "1.1"
name: spike-review-page-missing
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Review the spike ABC-34.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 90
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: spike-review
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-34'
  - name: no-write
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue|addOrEditJiraIssueComment|addOrEditJiraIssueWorklog|createJiraIssue|editJiraIssue|createConfluenceContent|updateConfluenceContent'
    match: not_contains
  - name: nothing-run
    type: tool_used
    tool: Bash
    input_match: 'invoices\.py|mktemp'
    min: 0
    max: 0
  - name: reason
    type: regex
    pattern: 'ABC-34|page|live doc'
    flags: i
