schema_version: "1.1"
name: spike-review-no-project
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Review the spike ABC-30.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 6
  timeout_seconds: 60
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: spike-review
  - name: no-jira
    type: regex
    target: mock_calls
    pattern: 'Jira|Confluence'
    match: not_contains
  - name: setup
    type: regex
    pattern: '/gemba:setup'
