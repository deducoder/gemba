schema_version: "1.1"
name: spike-review-happy
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Review the spike ABC-30.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 200
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: spike-review
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-30'
  - name: folder-found-before-the-mark
    type: tool_order
    before: mcp__plugin_atlassian-stub_atlassian__getConfluencePageDescendants
    after: mcp__plugin_atlassian-stub_atlassian__transitionJiraIssue
  - name: mark-by-destination
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue[\s\S]*id\W+41'
  - name: only-reads-before-the-mark
    type: regex
    target: mock_calls
    pattern: '(createJiraIssue|editJiraIssue|addCommentToJiraIssue|addWorklogToJiraIssue|createConfluencePage|updateConfluencePage)[\s\S]*transitionJiraIssue'
    match: not_contains
  - name: findings-read
    type: regex
    target: mock_calls
    pattern: 'getConfluencePage\b'
  - name: rerun-after-the-mark
    type: tool_order
    before: mcp__plugin_atlassian-stub_atlassian__transitionJiraIssue
    after:
      tool: Bash
      input_match: 'invoices\.py acme'
  - name: script-in-a-temporary-directory
    type: tool_used
    tool: Bash
    input_match: 'mktemp'
  - name: writes-nothing-in-confluence
    type: regex
    target: mock_calls
    pattern: 'createConfluencePage|updateConfluencePage|addCommentToJiraIssue'
    match: not_contains
  - name: no-worklog-yet
    type: regex
    target: mock_calls
    pattern: 'addWorklogToJiraIssue'
    match: not_contains
  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
