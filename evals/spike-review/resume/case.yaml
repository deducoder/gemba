schema_version: "1.1"
name: spike-review-resume
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Review the spike ABC-39.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 28
  timeout_seconds: 180
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: spike-review
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-39'
  - name: no-mark
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue|addWorklogToJiraIssue|createConfluencePage|updateConfluencePage'
    match: not_contains
  - name: rerun
    type: tool_used
    tool: Bash
    input_match: 'invoices\.py acme'
  - name: no-push
    type: tool_used
    tool: Bash
    input_match: 'git push'
    min: 0
    max: 0
