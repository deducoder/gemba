schema_version: "1.1"
name: epic-review-resume
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Review the epic ABC-47.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 120
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: epic-review
  - name: no-mark
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue'
    match: not_contains
  - name: no-code-review
    type: tool_used
    tool: Skill
    input_match: code-review
    min: 0
    max: 0
  - name: says-no-merges
    type: regex
    pattern: 'no (story )?merges?|no (code|merge)[\s\S]{0,40}review|nothing to review|sin merges?|no hay merges?'
    flags: i
  - name: no-worklog
    type: regex
    target: mock_calls
    pattern: 'addWorklogToJiraIssue'
    match: not_contains
