schema_version: "1.1"
name: epic-review-rejected-transition
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Review the epic ABC-46.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 120
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: epic-review
  - name: tried
    type: regex
    target: mock_calls
    pattern: 'transitionJiraIssue'
  - name: no-code-review
    type: tool_used
    tool: Skill
    input_match: code-review
    min: 0
    max: 0
  - name: no-merge-search
    type: tool_used
    tool: Bash
    input_match: 'git log --merges'
    min: 0
    max: 0
  - name: reason
    type: regex
    pattern: 'not valid|refus|reject'
    flags: i
