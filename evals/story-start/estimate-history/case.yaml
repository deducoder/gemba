schema_version: "1.1"
name: story-start-estimate-history
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a story: add a --csv option to invoices.py that prints the customer''s invoices as CSV.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 24
  timeout_seconds: 150
graders:
  - name: reads-time-spent
    type: regex
    target: mock_calls
    pattern: 'searchJiraIssuesUsingJql.*[Tt]ime[Ss]pent'
  - name: estimate-under-two-hours
    type: regex
    target: mock_calls
    pattern: 'createJiraIssue.*originalEstimate\W+(\d{1,2}m|1h(\s*\d{1,2}m)?)\W'
