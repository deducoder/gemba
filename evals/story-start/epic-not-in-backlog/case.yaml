schema_version: "1.1"
name: story-start-epic-not-in-backlog
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a story under the epic ABC-7: add a --csv option to invoices.py that prints the customer''s invoices as CSV.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 18
  timeout_seconds: 180
graders:
  - name: created
    type: regex
    target: mock_calls
    pattern: createJiraIssue
  - name: no-parent
    type: regex
    target: mock_calls
    pattern: 'parent\W+(key\W+)?ABC-7'
    match: not_contains
  - name: why
    type: regex
    pattern: 'Done(?! when)'
