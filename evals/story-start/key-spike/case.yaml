schema_version: "1.1"
name: story-start-key-spike
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare the story ABC-15.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 8
  timeout_seconds: 60
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: story-start
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-15'
  - name: no-write
    type: regex
    target: mock_calls
    pattern: 'createJiraIssue|editJiraIssue|addOrEditJiraIssueComment|createIssueLink|transitionJiraIssue'
    match: not_contains
  - name: spike
    type: regex
    pattern: '\bspike\b'
    flags: i
  - name: link
    type: regex
    pattern: 'https://example\.atlassian\.net/browse/ABC-15'
