schema_version: "1.1"
name: story-start-no-project
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a story: add a --csv option to invoices.py that prints the customer''s invoices as CSV.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 6
  timeout_seconds: 60
graders:
  - name: no-jira
    type: regex
    target: mock_calls
    pattern: 'Jira|IssueLink'
    match: not_contains
  - name: setup
    type: regex
    pattern: '/gemba:setup'
