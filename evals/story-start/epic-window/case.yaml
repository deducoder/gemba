schema_version: "1.1"
name: story-start-epic-window
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a story under the epic ABC-7: add a --csv option to invoices.py that prints the customer''s invoices as CSV.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 22
  timeout_seconds: 240
graders:
  - name: read-children
    type: regex
    target: mock_calls
    pattern: 'searchJiraIssuesUsingJql.*parent.*ABC-7'
  - name: parent
    type: regex
    target: mock_calls
    pattern: 'createJiraIssue.*parent\W+ABC-7'
  - name: warns
    type: regex
    pattern: '[Nn]o longer fit|do(es)? not fit|don.t fit'
  - name: reply
    type: regex
    pattern: 'https://example\.atlassian\.net/browse/ABC-42'
