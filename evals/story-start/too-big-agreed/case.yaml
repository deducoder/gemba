schema_version: "1.1"
name: story-start-too-big-agreed
plugins:
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
  history_file: history.jsonl
execution:
  prompt: 'Yes, go ahead with that split.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 60
  timeout_seconds: 900
graders:
  - name: stories
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__createJiraIssue
    min: 2
  - name: evidence
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__addCommentToJiraIssue
    min: 2
  - name: links
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__createIssueLink
    min: 1
  - name: keys
    type: regex
    pattern: 'ABC-10\d[\s\S]*ABC-10\d'
