schema_version: "1.1"
name: story-start-too-big-agreed
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
  history_file: history.jsonl
execution:
  prompt: 'Yes, go ahead with that split. Use a JSON file next to the script, SMTP with the host and credentials from environment variables, and fpdf2 for the PDF.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 39
  timeout_seconds: 300
graders:
  - name: stories
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__createJiraIssue
    min: 2
  - name: evidence
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__addCommentToJiraIssue
    min: 2
  - name: links
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__createIssueLink
    min: 1
  - name: keys
    type: regex
    pattern: 'ABC-101[\s\S]*ABC-102'
  - name: relates
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__createIssueLink
    input_match: '^(?=[\s\S]*type\W+Relates)(?=[\s\S]*Issue\W+ABC-101\b)(?=[\s\S]*Issue\W+ABC-102\b)'
  - name: agreed-blocks
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__createIssueLink
    input_match: '^(?=[\s\S]*type\W+Blocks)(?=[\s\S]*inwardIssue\W+ABC-103\b)(?=[\s\S]*outwardIssue\W+ABC-104\b)'
