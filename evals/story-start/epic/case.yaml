schema_version: "1.1"
name: story-start-epic
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a story under the epic ABC-7: add a --csv option to invoices.py that prints the customer''s invoices as CSV.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 40
  timeout_seconds: 600
graders:
  - name: read-epic
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-7'
  - name: parent
    type: regex
    target: mock_calls
    pattern: 'createJiraIssue.*parent\W+ABC-7'
  - name: reply
    type: regex
    pattern: 'https://example\.atlassian\.net/browse/ABC-42'
