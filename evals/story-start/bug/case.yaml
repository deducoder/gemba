schema_version: "1.1"
name: story-start-bug
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a story: the totals that invoices.py prints leave out the tax.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 11
  timeout_seconds: 60
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: story-start
  - name: no-create
    type: regex
    target: mock_calls
    pattern: createJiraIssue
    match: not_contains
  - name: bug
    type: regex
    pattern: '\bbug\b'
    flags: i
