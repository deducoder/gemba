schema_version: "1.1"
name: story-start-key-as-context
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a story: add a --csv option to invoices.py that prints the customer''s invoices as CSV, and keep in mind the rounding failure that ABC-5 reports.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 18
  timeout_seconds: 180
graders:
  - name: read-reference
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-5'
  - name: created
    type: regex
    target: mock_calls
    pattern: 'issueTypeName\W+Story'
  - name: no-link
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__executeWrite
    input_match: 'createJiraIssueLink'
    min: 0
    max: 0
  - name: reply
    type: regex
    pattern: 'https://example\.atlassian\.net/browse/ABC-42'
