schema_version: "1.1"
name: story-start-out-of-scope-none
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: '/gemba-code:story-start add a --csv option to invoices.py that prints the customer''s invoices as CSV.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 40
  timeout_seconds: 600
graders:
  - name: created
    type: regex
    target: mock_calls
    pattern: createJiraIssue
  - name: no-invented-exclusion
    type: regex
    target: mock_calls
    pattern: 'Out of scope[\s\S]*(Ninguno|None)\.'
