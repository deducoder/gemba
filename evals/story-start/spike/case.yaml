schema_version: "1.1"
name: story-start-spike
plugins:
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a story: make invoices.py stamp each invoice as a CFDI with the SAT through our PAC''s web service, so it prints the folio fiscal of each invoice.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 40
  timeout_seconds: 600
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: story-start
  - name: no-create
    type: regex
    target: mock_calls
    pattern: createJiraIssue
    match: not_contains
  - name: spike
    type: regex
    pattern: 'spike[\s\S]*\?'
    flags: i
