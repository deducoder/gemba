schema_version: "1.1"
name: story-start-small-edit
plugins:
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Fix the typo ''facutra'' in the comment at the top of invoices.py.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 40
  timeout_seconds: 600
graders:
  - name: no-skill
    type: tool_used
    tool: Skill
    input_match: story-start
    min: 0
    max: 0
