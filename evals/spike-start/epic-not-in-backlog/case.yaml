schema_version: "1.1"
name: spike-start-epic-not-in-backlog
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a spike under the epic ABC-7: can invoices.py fetch the invoices from the Acme Pay billing API instead of its INVOICES list? Whether the next story replaces the list depends on it.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 24
  timeout_seconds: 180
graders:
  - name: created
    type: regex
    target: mock_calls
    pattern: createJiraIssue
  - name: no-parent
    type: regex
    target: mock_calls
    pattern: 'parent\W+(key\W+)?ABC-7'
    match: not_contains
  - name: why
    type: regex
    pattern: 'Done(?! when)'
  - name: no-fix-version
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__createJiraIssue
    input_match: fixVersions
    min: 0
    max: 0
