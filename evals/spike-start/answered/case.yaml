schema_version: "1.1"
name: spike-start-answered
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a spike: can invoices.py fetch the invoices from the Acme Pay billing API instead of its INVOICES list? Whether the next story replaces the list depends on it.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 14
  timeout_seconds: 120
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: spike-start
  - name: no-create
    type: regex
    target: mock_calls
    pattern: 'createJiraIssue|editJiraIssue|addOrEditJiraIssueComment'
    match: not_contains
  - name: source
    type: regex
    pattern: 'docs/billing\.md'
