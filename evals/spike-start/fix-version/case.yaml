schema_version: "1.1"
name: spike-start-fix-version
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a spike for the fix version ABC v0.5.0: can invoices.py fetch the invoices from the Acme Pay billing API instead of its INVOICES list? Whether the next story replaces the list depends on it.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 24
  timeout_seconds: 180
graders:
  - name: skill
    type: tool_used
    tool: Skill
    input_match: spike-start
  - name: fix-version
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__createJiraIssue
    input_match: 'fixVersions\W+name\W+ABC v0\.5\.0'
