schema_version: "1.1"
name: spike-start-no-project
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a spike: can invoices.py fetch the invoices from the Acme Pay billing API instead of its INVOICES list? Whether the next story replaces the list depends on it.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 6
  timeout_seconds: 60
graders:
  - name: no-jira
    type: regex
    target: mock_calls
    pattern: 'Jira|IssueLink'
    match: not_contains
  - name: setup
    type: regex
    pattern: '/gemba:setup'
