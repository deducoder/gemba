schema_version: "1.1"
name: spike-start-epic-window
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare a spike under the epic ABC-7: can invoices.py fetch the invoices from the Acme Pay billing API instead of its INVOICES list? Whether the next story replaces the list depends on it.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 26
  timeout_seconds: 240
graders:
  - name: read-children
    type: regex
    target: mock_calls
    pattern: 'searchJiraIssuesUsingJql.*parent.*ABC-7'
  - name: parent
    type: regex
    target: mock_calls
    pattern: 'createJiraIssue.*parent\W+ABC-7'
  - name: warns
    type: regex
    pattern: '[Nn]o longer fit|do(es)? not fit|don.t fit'
  - name: reply
    type: regex
    pattern: 'https://example\.atlassian\.net/browse/ABC-60'
  - name: no-fix-version
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__createJiraIssue
    input_match: fixVersions
    min: 0
    max: 0
