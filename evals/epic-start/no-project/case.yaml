schema_version: "1.1"
name: epic-start-no-project
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare an epic: customers manage their invoices from invoices.py. They can export them as CSV and as JSON, filter them by amount, and mark an invoice as paid.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 6
  timeout_seconds: 60
graders:
  - name: no-jira
    type: regex
    target: mock_calls
    pattern: 'Jira|IssueLink'
    match: not_contains
  - name: setup
    type: regex
    pattern: '/gemba:setup'
