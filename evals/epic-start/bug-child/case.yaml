schema_version: "1.1"
name: epic-start-bug-child
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare an epic: customers manage their invoices from invoices.py. They can export them as CSV and as JSON, and the totals it prints must include the tax again, as they did before.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 300
graders:
  - name: no-create
    type: regex
    target: mock_calls
    pattern: createJiraIssue
    match: not_contains
  - name: bug-start
    type: regex
    pattern: 'bug-start'
