schema_version: "1.1"
name: epic-start-late-due-date
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
  history_file: history.jsonl
execution:
  prompt: 'Approved, but set the due date to 2026-12-15.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 16
  timeout_seconds: 180
graders:
  - name: no-create
    type: regex
    target: mock_calls
    pattern: createJiraIssue
    match: not_contains
  - name: release-date
    type: regex
    pattern: '2026-11-30'
  - name: asks
    type: regex
    pattern: '(another|other|different|later) (due )?(date|(fix )?version)|on or before|move the epic'
    flags: i
