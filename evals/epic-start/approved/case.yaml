schema_version: "1.1"
name: epic-start-approved
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
  history_file: history.jsonl
execution:
  prompt: 'Approved, go ahead.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 20
  timeout_seconds: 240
graders:
  - name: epic
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__createJiraIssue
    input_match: 'issueTypeName\W+Epic'
  - name: fields
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__createJiraIssue
    input_match: '^(?=[\s\S]*duedate\W+2026-10-26)(?=[\s\S]*fixVersions[\s\S]*ABC v1\.1\.0)(?=[\s\S]*priority\W+name\W+Medium)'
  - name: no-estimate
    type: regex
    target: mock_calls
    pattern: 'timetracking|originalEstimate|components'
    match: not_contains
  - name: one-issue
    type: tool_used
    tool: mcp__plugin_atlassian-stub_atlassian__createJiraIssue
    max: 1
  - name: reply
    type: regex
    pattern: 'https://example\.atlassian\.net/browse/ABC-60'
