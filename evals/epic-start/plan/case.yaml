schema_version: "1.1"
name: epic-start-plan
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare an epic: customers manage their invoices from invoices.py. They can export them as CSV and as JSON, filter them by amount, and mark an invoice as paid.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 30
  timeout_seconds: 300
graders:
  - name: no-create
    type: regex
    target: mock_calls
    pattern: createJiraIssue
    match: not_contains
  - name: fix-version
    type: regex
    target: mock_calls
    pattern: getJiraIssueTypeMetaWithFields
  - name: template
    type: regex
    pattern: 'Done when[\s\S]*Out of scope'
  - name: no-evidence
    type: regex
    pattern: '#+ *Evidence'
    match: not_contains
  - name: children
    type: regex
    pattern: '\b(Story|Spike)\b[\s\S]*\b(Highest|High|Medium|Low)\b[\s\S]*\b\d+[hd]\b'
  - name: release-date
    type: regex
    pattern: '2026-11-30|Nov(ember)? 30'
  - name: due-date
    type: regex
    pattern: '[Dd]ue date[\s\S]{0,200}2026-1[01]-\d\d'
