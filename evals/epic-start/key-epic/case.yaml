schema_version: "1.1"
name: epic-start-key-epic
plugins:
  - ../../../plugins/gemba
  - ../../../plugins/gemba-code
  - ../../../tests/fixtures/atlassian-stub
context:
  scaffold_script: setup.sh
execution:
  prompt: 'Declare the epic ABC-50: customers manage their invoices from invoices.py.'
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 8
  timeout_seconds: 90
graders:
  - name: read
    type: regex
    target: mock_calls
    pattern: 'getJiraIssue.*ABC-50'
  - name: no-create
    type: regex
    target: mock_calls
    pattern: createJiraIssue
    match: not_contains
  - name: link
    type: regex
    pattern: 'https://example\.atlassian\.net/browse/ABC-50'
